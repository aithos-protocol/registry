[workspace]
resolver = "3"
members = ["crates/a2a-card", "crates/registry-core", "crates/registry-api", "crates/registry-lambda", "crates/registry-e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
base64ct = { version = "1", features = ["alloc"] }
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
lambda_http = "1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
