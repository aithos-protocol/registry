[workspace]
resolver = "3"
members = ["crates/a2a-card", "crates/registry-core", "crates/registry-dns", "crates/registry-api", "crates/registry-lambda", "crates/registry-e2e", "crates/aithos-cli"]

[workspace.package]
# 0.1.0, no longer alpha: the registry the CLI defaults to is in production,
# a full identity lifecycle has run against it, and twelve blind audit rounds
# closed clean. Still 0.x, and that is the whole promise — a breaking change
# to the write protocol goes to 0.2.0, it never rides in on a patch.
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
# The pinned toolchain, not one version less: 1.90 was declared and never
# tested — no CI job built with it, so the claim was a guess published to
# crates.io. The MSRV a package states should be one something exercises,
# and the only toolchain exercised here is the pin.
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
base64ct = { version = "1", features = ["alloc"] }
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# `default-features = false` drops the SDK's legacy hyper-0.14 connector, which
# is what pulls in the unmaintained rustls 0.21 / h2 0.3 stack. The modern
# client (`default-https-client`, rustls + aws-lc) is the one actually used, and
# `cargo deny` is what made the difference visible.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "sso", "credentials-process"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
lambda_http = "1"
lambda_runtime = "1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
semver = "1"
pbkdf2 = "0.12"
aes-kw = "0.2"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
rpassword = "7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
