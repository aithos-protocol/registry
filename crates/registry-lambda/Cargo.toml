[package]
name = "registry-lambda"
description = "AWS backend and Lambda entry point for the Agent Card Registry."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
registry-api = { path = "../registry-api" }
registry-core = { package = "aithos-registry-core", path = "../registry-core", version = "0.1.0-alpha.1" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-s3 = { workspace = true }
lambda_http = { workspace = true }
lambda_runtime = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
base64ct = { workspace = true }
axum = { workspace = true }
subtle = "2"
sha2 = { workspace = true }
