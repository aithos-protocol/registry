[package]
name = "registry-lambda"
description = "AWS backend and Lambda entry point for the Agent Card Registry."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
registry-api = { path = "../registry-api" }
registry-core = { package = "aithos-registry-core", path = "../registry-core", version = "0.2.0" }
registry-dns = { package = "aithos-registry-dns", path = "../registry-dns", version = "0.2.0" }
# `join_all` for the revalidation pass; nothing else.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-s3 = { workspace = true }
lambda_http = { workspace = true }
lambda_runtime = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
base64ct = { workspace = true }
axum = { workspace = true }
subtle = "2"
sha2 = { workspace = true }
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aithos-catalog-signatures = { git = "https://github.com/Math1987/a2a_ai-catalog_trust-manifest-implementation", rev = "d11e5fd48a8645b7e2252cec5cd1160128e480e3", features = ["http"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
