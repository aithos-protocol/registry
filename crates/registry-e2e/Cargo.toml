[package]
name = "registry-e2e"
description = "End-to-end tests against a deployed registry."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]

[dev-dependencies]
a2a-card = { package = "aithos-a2a-card", path = "../a2a-card", version = "0.1.0" }
registry-core = { package = "aithos-registry-core", path = "../registry-core", version = "0.1.0" }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
base64ct = { workspace = true }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
