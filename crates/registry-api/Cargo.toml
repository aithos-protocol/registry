[package]
name = "registry-api"
description = "HTTP surface and storage contract for the Agent Card Registry."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
a2a-card = { package = "aithos-a2a-card", path = "../a2a-card", version = "0.2.0" }
registry-core = { package = "aithos-registry-core", path = "../registry-core", version = "0.2.0" }
registry-dns = { package = "aithos-registry-dns", path = "../registry-dns", version = "0.2.0" }
# `join_all` for resolving one request's domains concurrently; nothing else.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
semver = "1"

[dev-dependencies]
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64ct = { workspace = true }
