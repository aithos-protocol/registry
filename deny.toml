# `cargo deny check advisories` — the advisories that are known and accepted.
#
# Each entry states why it does not apply here. An advisory with no reason is a
# problem waiting to be rediscovered.

[advisories]
ignore = [
  # RUSTSEC-2023-0071 — Marvin, a timing side channel in RSA private-key
  # operations. This registry only ever verifies signatures; it holds no RSA
  # private key and performs no private operation.
  "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "allow"

[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
