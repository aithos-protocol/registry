name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because `cargo deny` is only as fresh as its last run: an advisory
  # published between two pushes would otherwise wait for the next commit —
  # which may be a month away — before anything turned red.
  schedule:
    - cron: "17 5 * * 1"

env:
  CARGO_TERM_COLOR: always
  # A failure in CI should be a failure in the code, not a flake.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: rustup show   # honours rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

      # The end-to-end tests are #[ignore]d and need a deployed environment, so
      # they are absent here by construction rather than by exclusion.
      - run: cargo test --all

      # The deterministic core is meant to run in the browser that signs a card.
      # If that stops being true, the two sides can drift byte for byte.
      - name: Check that a2a-card still builds for the browser
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p aithos-a2a-card --target wasm32-unknown-unknown

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `cargo deny` alone, deliberately. It reads `deny.toml`, which holds the
      # license allowlist and the one documented RUSTSEC exception, and it
      # covers advisories as well. `rustsec/audit-check` used to run alongside
      # it and reads `.cargo/audit.toml` instead — a file that does not exist
      # here — so it reported the documented exception as a failure on every
      # run. A check that is always red is a check nobody reads.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories

  # The artifact the service actually runs. The release workflow builds and
  # attests the CLI for five targets, but Terraform deploys
  # `target/lambda/registry.zip` — and that zip was born on a workstation,
  # tied to no commit. Twice now an audit has found it stale in a way an
  # apply would have deployed backwards; this job is what makes that
  # impossible to repeat silently. Native arm64: the runner is the target
  # architecture, so no cross toolchain sits between the source and the
  # artifact.
  lambda:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write      # to sign the provenance attestation
      attestations: write  # to record it against this repository
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: |
          rustup show   # honours rust-toolchain.toml
          rustup target add aarch64-unknown-linux-musl

      - name: musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      # Static musl, not the runner's glibc. Ubuntu 24.04 carries a glibc
      # years newer than provided.al2023's, so a build against the host
      # glibc wants versioned symbols the runtime does not have and dies at
      # init, taking every route with it — exactly what took dev down on
      # 31/08, one apply after this job first shipped. The release already
      # builds the Linux CLI this way; static linking removes the glibc
      # floor instead of managing it.
      - name: Build the service for Graviton
        run: cargo build --release --locked -p registry-lambda --target aarch64-unknown-linux-musl

      - name: Package
        run: |
          mkdir -p target/lambda
          cp target/aarch64-unknown-linux-musl/release/bootstrap target/lambda/bootstrap
          (cd target/lambda && zip -q -j registry.zip bootstrap)
          # The refusals experience has taught: never package the wrong
          # architecture, and never package a binary with a dynamic glibc
          # dependency — the runtime's glibc is older than any runner's.
          file target/lambda/bootstrap | grep -q aarch64
          file target/lambda/bootstrap | grep -qi static

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/lambda/registry.zip

      # Ninety days: long enough that the artifact running in an environment
      # is still downloadable when someone asks where it came from.
      - uses: actions/upload-artifact@v4
        with:
          name: registry-zip-${{ github.sha }}
          path: target/lambda/registry.zip
          retention-days: 90

  # `openapi.json` is checked twice, and the two checks catch different things.
  # The Rust suite checks it against this repository — the router, the problem
  # catalogue, the specification tables. This checks it against the OpenAPI
  # specification itself, which is what the client generators and the request
  # collections downstream of it will assume. The first run of this job found
  # two descriptions that a comma had silently turned into extra members.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned, like every other tool here: a linter that updates itself turns
      # somebody else's new rule into this repository's red build.
      - run: npx --yes @redocly/cli@2.50.0 lint openapi.json

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.5

      - run: terraform fmt -check -recursive
      # No credentials and no backend: validate checks the configuration, and
      # anything needing an account belongs in a deployment, not in CI.
      - run: terraform init -backend=false
      - run: terraform validate
